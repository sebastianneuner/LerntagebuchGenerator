# Baut die App fuer Windows und Linux und haengt sie an ein GitHub Release.
#
# Ausloeser: ein Tag wie v1.0.0 pushen
#     git tag v1.0.0
#     git push origin v1.0.0
# Manuell starten (Actions -> Release -> Run workflow) baut nur, ohne Release;
# die Dateien liegen dann als Artefakt am Workflow-Lauf.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # zum Anlegen des Releases

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          # Fest statt ubuntu-latest: Die Linux-Version laeuft nur auf Systemen
          # mit mindestens der glibc des Build-Systems (24.04: glibc 2.39).
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: python -m pip install -r requirements-dev.txt

      - name: Tkinter vorhanden?
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: App bauen
        run: python -m PyInstaller --noconfirm lerntagebuch.spec

      # Windows: ZIP. Linux: tar.gz, damit das Ausfuehrungsrecht erhalten bleibt.
      - name: Packen (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Lerntagebuch -DestinationPath "Lerntagebuch-${{ github.ref_name }}-windows.zip"

      - name: Packen (Linux)
        if: matrix.platform == 'linux'
        run: tar -czf "Lerntagebuch-${{ github.ref_name }}-linux.tar.gz" -C dist Lerntagebuch

      - uses: actions/upload-artifact@v7
        with:
          name: lerntagebuch-${{ matrix.platform }}
          path: Lerntagebuch-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: Lerntagebuch-*
          fail_on_unmatched_files: true
          generate_release_notes: true
